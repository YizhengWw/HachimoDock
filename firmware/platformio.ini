[platformio]
src_dir = main

[env:esp32_p4_evboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-p4-wlk2802-32mb
framework = espidf
build_flags =
  -DBSP_CONFIG_NO_GRAPHIC_LIB=1
custom_p4_project_version = 0.7.64-p4
custom_p4_uart_baud = 4000000
monitor_speed = 4000000
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.embed_files =
  ../pc/public/terrier-clips/done.wav
  ../pc/public/terrier-clips/error.wav
  ../pc/public/terrier-clips/waiting_user.wav
extra_scripts =
  pre:scripts/platformio_add_p4_toolchain.py
  scripts/platformio_chip_images.py
  scripts/platformio_factory_image.py

[env:esp32_p4_evboard_windows]
extends = env:esp32_p4_evboard
; Compatibility build alias; both desktop platforms use the same firmware.

[env:esp32_p4_aec_fd_bench]
extends = env:esp32_p4_evboard
; Isolated v1 acoustic comparison only; never bundled as production firmware.
custom_p4_project_version = 0.7.59-p4-fdbench
build_flags =
  ${env:esp32_p4_evboard.build_flags}
  -DPET_P4_AEC_BENCH_FD=1

[env:esp32_p4_evboard_v3]
extends = env:esp32_p4_evboard
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
custom_p4_chip_family = v3
board_build.f_cpu = 400000000L
