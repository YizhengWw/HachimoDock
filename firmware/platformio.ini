[platformio]
src_dir = main
default_envs = esp32_p4_evboard

[env:esp32_p4_evboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-p4-wlk2802-32mb
framework = espidf
build_flags =
  -DBSP_CONFIG_NO_GRAPHIC_LIB=1
custom_p4_project_version = 0.7.103-p4-r179
custom_p4_uart_baud = 4000000
monitor_speed = 4000000
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.embed_files =
  assets/instruments/wooden_fish_body.deflate
  assets/instruments/wooden_fish_mallet.deflate
  assets/component-center/center_background.jpg
  assets/component-center/center_thumbs.deflate
  assets/fonts/pet_cn_16.deflate
  assets/fonts/pet_cn_metrics.deflate
  assets/fonts/pet_cn_metrics_columns.deflate
extra_scripts =
  pre:scripts/platformio_add_p4_toolchain.py
  scripts/platformio_chip_images.py
  scripts/platformio_factory_image.py

[env:esp32_p4_uart_2m_reference]
extends = env:esp32_p4_canvas_candidate
; Private silent link comparison only; never changes the public UART default.
custom_p4_project_version = 0.7.103-p4-r66-link2m
custom_p4_uart_baud = 2000000
monitor_speed = 2000000

[env:esp32_p4_uart_paced_reference]
extends = env:esp32_p4_canvas_candidate
; Private silent 4M burst experiment. Never a release or acoustic acceptance.
custom_p4_project_version = 0.7.103-p4-r74-linkpaced
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_P4_UART_PACED_REFERENCE=1

[env:esp32_p4_uart_paced256_reference]
extends = env:esp32_p4_canvas_candidate
; Private burst-granularity comparison, no public/audio transport promotion.
custom_p4_project_version = 0.7.103-p4-r79-linkpaced256
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_P4_UART_PACED_REFERENCE=1
  -DPET_P4_UART_PACED_BYTES=256

[env:esp32_p4_control_integrity_probe]
extends = env:esp32_p4_canvas_candidate
; Private unpaced corruption observation; no driver/audio/OS change.
custom_p4_project_version = 0.7.103-p4-r88-control
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_P4_SERIAL_CONTROL_INTEGRITY=1

[env:esp32_p4_control_paced_probe]
extends = env:esp32_p4_control_integrity_probe
; Separate private256-byte wire-paced comparison, never a public promotion.
custom_p4_project_version = 0.7.103-p4-r89-controlpaced
build_flags =
  ${env:esp32_p4_control_integrity_probe.build_flags}
  -DPET_P4_UART_PACED_REFERENCE=1
  -DPET_P4_UART_PACED_BYTES=256

[env:esp32_p4_program_candidate]
extends = env:esp32_p4_canvas_candidate
; Private foreground-only admission after r64 main maximum-image measurement.
; Not a release, background/mixed-service grant or voice/AEC acceptance.
custom_p4_project_version = 0.7.103-p4-r66-program
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_COMPONENT_PROGRAM_EXECUTION_REVIEWED=1

[env:esp32_p4_storage_io_probe]
extends = env:esp32_p4_canvas_candidate
; Private physical HAL observation only; no cache, filesystem policy or grant.
custom_p4_project_version = 0.7.103-p4-r77-io
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_P4_STORAGE_IO_TRACE_ENABLE=1
  -Wl,--wrap=spiffs_api_read
  -Wl,--wrap=spiffs_api_write
  -Wl,--wrap=spiffs_api_erase

[env:esp32_p4_render_lcd_probe]
extends = env:esp32_p4_canvas_candidate
; Private same-frame comparison/driver/fence wall observation, no optimization.
custom_p4_project_version = 0.7.103-p4-r84-lcdtrace
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_P4_RENDER_LCD_SPLIT_PROBE=1

[env:esp32_p4_render_span_probe]
extends = env:esp32_p4_render_lcd_probe
; Private bit-exact opaque fill throughput comparison, no audio/clock changes.
custom_p4_project_version = 0.7.103-p4-r86-span
build_flags =
  ${env:esp32_p4_render_lcd_probe.build_flags}
  -DPET_P4_RENDER_SPAN_FILL=1

[env:esp32_p4_render_queue_probe]
extends = env:esp32_p4_render_lcd_probe
; Private pinned-SDK preparation/queue wall split; original blocking work stays.
custom_p4_project_version = 0.7.103-p4-r91-ppaqueuetrace
build_flags =
  ${env:esp32_p4_render_lcd_probe.build_flags}
  -DPET_P4_PPA_QUEUE_PROBE=1
  -Wl,--wrap=ppa_do_operation

[env:esp32_p4_render_rotate_probe]
extends = env:esp32_p4_render_queue_probe
; Private bit-exact blocked CPU rotation vs unchanged original PPA control.
custom_p4_project_version = 0.7.103-p4-r92-rotatetile
build_flags =
  ${env:esp32_p4_render_queue_probe.build_flags}
  -DPET_P4_RENDER_ROTATE_TILE=1

[env:esp32_p4_render_pack_probe]
extends = env:esp32_p4_render_queue_probe
; Private bit-exact aligned pack8 comparison; original PPA/ownership unchanged.
custom_p4_project_version = 0.7.103-p4-r94-packword
build_flags =
  ${env:esp32_p4_render_queue_probe.build_flags}
  -DPET_P4_H264_PACK_WORD_IO=1

[env:esp32_p4_storage_uniform_control]
extends = env:esp32_p4_storage_io_probe
custom_p4_project_version = 0.7.103-p4-r78-uniform0
build_flags =
  ${env:esp32_p4_storage_io_probe.build_flags}
  -DPET_P4_STORAGE_UNIFORM_CACHE_ENABLE=1
  -DPET_P4_STORAGE_UNIFORM_CACHE_APPLY=0

[env:esp32_p4_storage_uniform_probe]
extends = env:esp32_p4_storage_io_probe
custom_p4_project_version = 0.7.103-p4-r78-uniform1
build_flags =
  ${env:esp32_p4_storage_io_probe.build_flags}
  -DPET_P4_STORAGE_UNIFORM_CACHE_ENABLE=1
  -DPET_P4_STORAGE_UNIFORM_CACHE_APPLY=1

[env:esp32_p4_storage_page_control]
extends = env:esp32_p4_storage_io_probe
custom_p4_project_version = 0.7.103-p4-r82-page0
build_flags =
  ${env:esp32_p4_storage_io_probe.build_flags}
  -DPET_P4_STORAGE_PAGE_CACHE_ENABLE=1
  -DPET_P4_STORAGE_PAGE_CACHE_APPLY=0

[env:esp32_p4_storage_page_probe]
extends = env:esp32_p4_storage_io_probe
custom_p4_project_version = 0.7.103-p4-r82-page1
build_flags =
  ${env:esp32_p4_storage_io_probe.build_flags}
  -DPET_P4_STORAGE_PAGE_CACHE_ENABLE=1
  -DPET_P4_STORAGE_PAGE_CACHE_APPLY=1

[env:esp32_p4_storage_page_stride]
extends = env:esp32_p4_storage_page_probe
custom_p4_project_version = 0.7.103-p4-r82-page2
build_flags =
  ${env:esp32_p4_storage_page_probe.build_flags}
  -DPET_P4_STORAGE_PAGE_CACHE_STRIDE_HASH=1

[env:esp32_p4_storage_page_parent]
extends = env:esp32_p4_storage_page_stride
; Private real storage-lifecycle cache, no diagnostic begin needed, no grants.
custom_p4_project_version = 0.7.103-p4-r90-pageauto
build_flags =
  ${env:esp32_p4_storage_page_stride.build_flags}
  -DPET_P4_STORAGE_CACHE_SCOPE_ENABLED=1

[env:esp32_p4_background_candidate]
extends = env:esp32_p4_program_candidate
; Explicit native controller of verified installed programs, private only.
; Global PROGRAM quota remains ONE/4096, audio reservation still revokes it.
; No package autostart, boot restart, effects, arbitrary mix or acoustic grant.
custom_p4_project_version = 0.7.103-p4-r81-background
build_flags =
  ${env:esp32_p4_program_candidate.build_flags}
  -DPET_COMPONENT_BACKGROUND_ENABLED=1

[env:esp32_p4_program_parent_candidate]
extends = env:esp32_p4_background_candidate
; Private aggregate parent: TWO physical leases, still 4096 TOTAL fuel and
; one 64-instruction dispatch per main turn. Not an audio/mixed-media grant.
custom_p4_project_version = 0.7.103-p4-r85-parent
build_flags =
  ${env:esp32_p4_background_candidate.build_flags}
  -DPET_COMPONENT_PROGRAM_PARENT_UNIFIED=1

[env:esp32_p4_program_parent_acceptance]
extends = env:esp32_p4_program_parent_candidate
; One extra TEST slot avoids deleting retained user data for two-owner HIL.
; Remove exact owned fixtures before returning to the ordinary 32-slot image.
custom_p4_project_version = 0.7.103-p4-r87-parent33
build_flags =
  ${env:esp32_p4_program_parent_candidate.build_flags}
  -DPET_PRIVATE_PARENT_CAPACITY_ACCEPTANCE=1

[env:esp32_p4_evboard_windows]
extends = env:esp32_p4_evboard
; Compatibility build alias; both desktop platforms use the same firmware.

[env:esp32_p4_framework_mixed_acceptance]
extends = env:esp32_p4_program_parent_acceptance
; Private joint acceptance: same TWO leases/4096 total/64 aggregate quantum,
; exact scoped cache and guarded paced link. No media/peripheral/autostart grant.
; One extra owned-test slot only; clean fixtures before returning to32 slots.
custom_p4_project_version = 0.7.103-p4-r93-mixed33
build_flags =
  ${env:esp32_p4_program_parent_acceptance.build_flags}
  -DPET_P4_STORAGE_IO_TRACE_ENABLE=1
  -DPET_P4_STORAGE_PAGE_CACHE_ENABLE=1
  -DPET_P4_STORAGE_PAGE_CACHE_APPLY=1
  -DPET_P4_STORAGE_PAGE_CACHE_STRIDE_HASH=1
  -DPET_P4_STORAGE_CACHE_SCOPE_ENABLED=1
  -Wl,--wrap=spiffs_api_read
  -Wl,--wrap=spiffs_api_write
  -Wl,--wrap=spiffs_api_erase
  -DPET_P4_SERIAL_CONTROL_INTEGRITY=1
  -DPET_P4_UART_PACED_REFERENCE=1
  -DPET_P4_UART_PACED_BYTES=256

[env:esp32_p4_query_lock_control]
extends = env:esp32_p4_framework_mixed_acceptance
; Private paired query-lock observation, same program/cache/transport grants.
custom_p4_project_version = 0.7.103-p4-r95-querylock0
build_flags =
  ${env:esp32_p4_framework_mixed_acceptance.build_flags}
  -DPET_P4_QUERY_REPLY_TRACE=1

[env:esp32_p4_query_lock_probe]
extends = env:esp32_p4_framework_mixed_acceptance
; No extra task, buffer, queue, priority or retry; defer immutable query TX only.
custom_p4_project_version = 0.7.103-p4-r95-querylock1
build_flags =
  ${env:esp32_p4_framework_mixed_acceptance.build_flags}
  -DPET_P4_QUERY_REPLY_TRACE=1
  -DPET_P4_QUERY_REPLY_DEFERRED=1

[env:esp32_p4_watchdog_phase_probe]
extends = env:esp32_p4_query_lock_probe
; Passive fixed RTC evidence only. Do NOT alter any watchdog/audio/priority gate.
custom_p4_project_version = 0.7.103-p4-r96-resetphase
build_flags =
  ${env:esp32_p4_query_lock_probe.build_flags}
  -DPET_P4_RESET_PHASE_TRACE=1

[env:esp32_p4_storage_query_control]
extends = env:esp32_p4_watchdog_phase_probe
; Same refined numeric phases, original synchronous SPIFFS statistics query.
custom_p4_project_version = 0.7.103-p4-r97-storagequery0
build_flags =
  ${env:esp32_p4_watchdog_phase_probe.build_flags}

[env:esp32_p4_storage_query_probe]
extends = env:esp32_p4_watchdog_phase_probe
; Read-only telemetry snapshot refreshed by existing save worker, no new task.
custom_p4_project_version = 0.7.103-p4-r97-storagequery1
build_flags =
  ${env:esp32_p4_watchdog_phase_probe.build_flags}
  -DPET_P4_DIAGNOSTIC_STORAGE_CACHED=1

[env:esp32_p4_native_erase_phase_probe]
extends = env:esp32_p4_storage_query_probe
; Passive call boundaries only, original SDK implementations exactly once.
custom_p4_project_version = 0.7.103-p4-r98-erasephase
build_flags =
  ${env:esp32_p4_storage_query_probe.build_flags}
  -DPET_P4_FLASH_PHASE_TRACE=1
  -Wl,--wrap=esp_partition_erase_range
  -Wl,--wrap=esp_flash_erase_region
  -Wl,--wrap=spi_flash_chip_generic_yield
  -Wl,--wrap=spi_flash_chip_generic_erase_sector
  -Wl,--wrap=spi_flash_chip_winbond_erase_sector
  -Wl,--wrap=spi_flash_chip_generic_wait_idle
  -Wl,--wrap=spi_flash_check_and_flush_cache

[env:esp32_p4_ota_metadata_probe]
extends = env:esp32_p4_native_erase_phase_probe
; Trusted boot/validation observations, no repeated hot-query MMU operations.
custom_p4_project_version = 0.7.103-p4-r99-otametadata
build_flags =
  ${env:esp32_p4_native_erase_phase_probe.build_flags}
  -DPET_P4_OTA_METADATA_CACHED=1

[env:esp32_p4_native_panic_probe]
extends = env:esp32_p4_ota_metadata_probe
; Private passive numeric exception sites. Native handler executes unchanged.
custom_p4_project_version = 0.7.103-p4-r101-nativepanic
build_flags =
  ${env:esp32_p4_ota_metadata_probe.build_flags}
  -DPET_P4_NATIVE_PANIC_TRACE=1
  -Wl,--wrap=esp_panic_handler

[env:esp32_p4_recorder_cost_control]
extends = env:esp32_p4_native_panic_probe
; Same finite boot measurement and IRAM-safe recorder, original cache-hit marks.
custom_p4_project_version = 0.7.103-p4-r102-costcontrol
build_flags =
  ${env:esp32_p4_native_panic_probe.build_flags}
  -DPET_P4_RESET_PHASE_BENCHMARK=1

[env:esp32_p4_recorder_cost_probe]
extends = env:esp32_p4_recorder_cost_control
; No RTC writes for software-only cache hits; native IO scopes unchanged.
custom_p4_project_version = 0.7.103-p4-r103-costprobe
build_flags =
  ${env:esp32_p4_recorder_cost_control.build_flags}
  -DPET_P4_RESET_PHASE_CACHE_HITS=0

[env:esp32_p4_storage_save_parent]
extends = env:esp32_p4_recorder_cost_probe
; Same bounded exact-byte cache for independently admitted native save jobs.
; No expiry extension, new task/priority, retry or ordinary-profile promotion.
custom_p4_project_version = 0.7.103-p4-r104-savecache
build_flags =
  ${env:esp32_p4_recorder_cost_probe.build_flags}
  -DPET_P4_STORAGE_SAVE_CACHE_SCOPE_ENABLED=1

[env:esp32_p4_boot_trace_control]
extends = env:esp32_p4_storage_save_parent
; Passive milestone timestamps only; original boot reads remain unchanged.
custom_p4_project_version = 0.7.103-p4-r105-bootcontrol
build_flags =
  ${env:esp32_p4_storage_save_parent.build_flags}
  -DPET_P4_BOOT_TRACE_ENABLE=1

[env:esp32_p4_boot_cache_parent]
extends = env:esp32_p4_boot_trace_control
; Fresh finite native cache lifetime per verified package, never an integrity skip.
custom_p4_project_version = 0.7.103-p4-r106-bootcache
build_flags =
  ${env:esp32_p4_boot_trace_control.build_flags}
  -DPET_P4_STORAGE_BOOT_CACHE_SCOPE_ENABLED=1

[env:esp32_p4_snapshot_close_parent]
extends = env:esp32_p4_boot_cache_parent
; Private close-receipt/correlation comparison; legacy peers remain unchanged.
custom_p4_project_version = 0.7.103-p4-r107-closeack
build_flags =
  ${env:esp32_p4_boot_cache_parent.build_flags}
  -DPET_P4_SCREENSHOT_CLOSE_ACK=1
  -DPET_P4_STORAGE_BOOT_CACHE_BATCH_ENABLED=1
  -DPET_COMPONENT_PROGRAM_RAM_RESUME=1

[env:esp32_p4_unchanged_parent]
extends = env:esp32_p4_snapshot_close_parent
; Private filesystem-byte no-op comparison, no ordinary grant changes.
custom_p4_project_version = 0.7.103-p4-r108-unchanged
build_flags =
  ${env:esp32_p4_snapshot_close_parent.build_flags}
  -DPET_P4_STORAGE_PRESERVE_UNCHANGED=1

[env:esp32_p4_save_budget_parent]
extends = env:esp32_p4_unchanged_parent
; Private saved-snapshot stack reduction, unchanged task stack/priority/SDK.
custom_p4_project_version = 0.7.103-p4-r109-savebudget
build_flags =
  ${env:esp32_p4_unchanged_parent.build_flags}
  -DPET_APP_SAVE_OWNED_PENDING_ENABLED=1

[env:esp32_p4_lookup_parent]
extends = env:esp32_p4_save_budget_parent
; Private positive lookup-start hints, original catalog transactions/Same8FDs.
custom_p4_project_version = 0.7.103-p4-r110-lookupfull
build_flags =
  ${env:esp32_p4_save_budget_parent.build_flags}
  -DPET_P4_SPIFFS_HINT_ENABLE=1
  -DPET_P4_SPIFFS_HINT_APPLY=1
  -Wl,--wrap=spiffs_object_find_object_index_header_by_name
  -DPET_P4_FILE_EXACT_TRACE_ENABLE=1

[env:esp32_p4_storage_cache_control]
extends = env:esp32_p4_scheduler_probe
; Private same-source silent control: normal eight descriptors/cache pages.
custom_p4_project_version = 0.7.103-p4-r67-cache8

[env:esp32_p4_storage_cache_probe]
extends = env:esp32_p4_scheduler_probe
; Private same-source silent memory/throughput comparison, never public.
custom_p4_project_version = 0.7.103-p4-r67-cache31
build_flags =
  ${env:esp32_p4_scheduler_probe.build_flags}
  -DPET_P4_STORAGE_CACHE_EXPERIMENT=1
  -DPET_P4_SPIFFS_MAX_FILES=31

[env:esp32_p4_storage_lookup_control]
extends = env:esp32_p4_scheduler_probe
; Private same-RAM observer, applies no lookup-start hints.
custom_p4_project_version = 0.7.103-p4-r68-lookup0
build_flags =
  ${env:esp32_p4_scheduler_probe.build_flags}
  -DPET_P4_SPIFFS_HINT_ENABLE=1
  -DPET_P4_SPIFFS_HINT_APPLY=0
  -Wl,--wrap=spiffs_object_find_object_index_header_by_name

[env:esp32_p4_storage_lookup_probe]
extends = env:esp32_p4_storage_lookup_control
; Same bounded memory/observer, applies only search START coordinates.
custom_p4_project_version = 0.7.103-p4-r68-lookup1
build_flags =
  ${env:esp32_p4_scheduler_probe.build_flags}
  -DPET_P4_SPIFFS_HINT_ENABLE=1
  -DPET_P4_SPIFFS_HINT_APPLY=1
  -Wl,--wrap=spiffs_object_find_object_index_header_by_name

[env:esp32_p4_framework_parent]
extends = env:esp32_p4_ppa_copy_parent
; Private: the five-gap framework merge (logic v1 / quota v2 / sfx v1 contracts, local tools, hotkeys) on top of the
; verified r143 PPA-copy chain. No new render/storage/reply switch; same build flags as the parent. New version so the
; verified r143-ppacopy OTA label is never re-flashed with a different ELF.
custom_p4_project_version = 0.7.103-p4-r142-framework
build_flags =
  ${env:esp32_p4_ppa_copy_parent.build_flags}

[env:esp32_p4_main_frame_parent]
extends = env:esp32_p4_framework_parent
; Private: the main-page H.264 pack (I420 -> packed YUV420 for the PPA, 16.9 ms of render-frame CPU/join in the
; r142 worst frame 71.8 ms = asset 42.6 + overlay 4.4 + rotate 12.9 + lcd 11.8) moves onto the existing priority-1
; prefetch worker into two static PSRAM back buffers; the render frame adopts the finished buffer and keeps its one
; PPA convert. Same kernel, same bytes, same conversion; no new task, priority, clock or internal RAM.
custom_p4_project_version = 0.7.103-p4-r145-mainframe
build_flags =
  ${env:esp32_p4_framework_parent.build_flags}
  -DPET_P4_H264_WORKER_PACK=1

[env:esp32_p4_capability_parent]
extends = env:esp32_p4_main_frame_parent
; Shared private capability parent (r150): every default-off package-capability flag of the four parallel
; capability tracks is enabled ONLY here, on top of the verified main-frame chain. Same tasks, priorities,
; clocks and sdkconfig; the public candidate rides this env.
custom_p4_project_version = 0.7.103-p4-r150-capability
build_flags =
  ${env:esp32_p4_main_frame_parent.build_flags}
  -DPET_INSTRUMENT_TONE_PACKED=1
  -DPET_FONT_NATIVE_32=1
  -DPET_P4_TEXT_TABLE=1
  -DPET_P4_CELLS_V1=1
  -DPET_P4_QUOTA_V3=1
  -DPET_P4_PROGRAM_V2=1
  -DPET_P4_GRAPHICS_V2=1
  -DPET_P4_CANVAS_V2=1
  -DPET_P4_PARTICLES=1
  -DPET_P4_KEYFRAME_BG=1
  -DPET_P4_BODIES=1
  -DPET_FORM_V2_ENABLED=1
  -DPET_FORM_V3_ENABLED=1
  -DPET_P4_APP_SHELL=1
  -DPET_P4_DATA_ROWS=1
  -DPET_P4_LONGTEXT=1
  -DPET_P4_NOTIFY=1
  -DPET_P4_SEQUENCE=1
  -DPET_P4_SAMPLES=1
  -DPET_P4_CLIP=1
  -DPET_P4_BIG_IMAGE=1
  -DPET_P4_EVENTS=1

[env:esp32_p4_program_public_candidate]
extends = env:esp32_p4_capability_parent
; Public program candidate (normal-build admission). r137 proved the plain evboard base fails the fixed
; frame/gap/DMA gates on the device, so the candidate now carries the verified render/storage/reply chain
; and only undefines the switches the admission matrix does not admit: 33-slot capacity acceptance,
; variable owners (capability mixing), RAM resume, and the private UART pacing reference. ONE program
; lease / 4096 fuel via the explicit profile table. Not the default OTA image.
custom_p4_project_version = 0.7.103-p4-r179
build_flags =
  ${env:esp32_p4_capability_parent.build_flags}
  -UPET_PRIVATE_PARENT_CAPACITY_ACCEPTANCE
  -UPET_VARIABLE_OWNERS_ENABLED
  -UPET_COMPONENT_PROGRAM_RAM_RESUME
  -UPET_P4_UART_PACED_REFERENCE
  -UPET_P4_UART_PACED_BYTES
  -DPET_P4_PUBLIC_PROGRAM_PROFILE=1
  -DPET_P4_CONVERSATION_VIDEO=1
  ; Control/screenshot bursts only; no-drain audio/media and 4M baud stay unchanged.
  -DPET_P4_UART_CONTROL_PACING=1
  ; R159 candidate-only service presentation; admission still requires fixed HIL gates.
  -DPET_SERVICE_BRIDGE_ENABLED=1
  -DPET_HOST_COLLECTION_ENABLED=1

[env:esp32_p4_program_public_candidate_v3]
extends = env:esp32_p4_program_public_candidate
; Chip-family twin of the public candidate (same source, flags and label) for the bundled firmware-v3.bin
; (ESP32-P4 revision 300-399), mirroring esp32_p4_evboard_v3's platform / chip family / clock.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
custom_p4_chip_family = v3
board_build.f_cpu = 400000000L

[env:esp32_p4_canvas_candidate]
extends = env:esp32_p4_evboard
; Drawing, mixed-form and PC-fed collection development target; never public/OTA.
custom_p4_project_version = 0.7.103-p4-r66-ui
build_flags =
  ${env:esp32_p4_evboard.build_flags}
  -DPET_CANVAS_ENABLED=1
  -DPET_FORM_V2_ENABLED=1
  -DPET_HOST_COLLECTION_ENABLED=1
  -DPET_COMPONENT_PROGRAM_ENABLED=1
  -DPET_FONT_BITMAP_PACKED=1

[env:esp32_p4_touch_bench]
extends = env:esp32_p4_evboard
; Native touch/slicing diagnostic on v1 silicon; not a release bundle.
custom_p4_project_version = 0.7.75-p4-touch

[env:esp32_p4_render_reference]
extends = env:esp32_p4_canvas_candidate
; Private same-clip A/B scheduling control. Never a release or program grant.
custom_p4_project_version = 0.7.103-p4-r55-ref
build_flags =
  ${env:esp32_p4_canvas_candidate.build_flags}
  -DPET_COMPONENT_PROGRAM_EXECUTION_REVIEWED=0
  -DPET_P4_RENDER_SCHEDULING_REFERENCE=1
  -DPET_P4_RENDER_REFERENCE_PRIORITY=9

[env:esp32_p4_scheduler_probe]
extends = env:esp32_p4_evboard
; Passive opt-in trace only. Not a release image or a user-program grant.
custom_p4_project_version = 0.7.103-p4-r66-trace
build_flags =
  ${env:esp32_p4_evboard.build_flags}
  -DPET_P4_SCHED_TRACE_ENABLE=1
  -Wl,--wrap=spiffs_api_lock
  -Wl,--wrap=spiffs_api_unlock
  -Wl,--wrap=xTaskPriorityInherit
  -Wl,--wrap=xTaskPriorityDisinherit
  -Wl,--wrap=vTaskSwitchContext

[env:esp32_p4_aec_fd_bench]
extends = env:esp32_p4_evboard
; Isolated v1 acoustic comparison only; never bundled as production firmware.
custom_p4_project_version = 0.7.59-p4-fdbench
build_flags =
  ${env:esp32_p4_evboard.build_flags}
  -DPET_P4_AEC_BENCH_FD=1

[env:esp32_p4_state_memory_parent]
extends = env:esp32_p4_lookup_parent
; Private task-model placement experiment; no new program/service grant.
custom_p4_project_version = 0.7.103-p4-r111-statepsram
build_flags =
  ${env:esp32_p4_lookup_parent.build_flags}
  -DPET_P4_STATE_EXTERNAL=1

[env:esp32_p4_variable_owners_parent]
extends = env:esp32_p4_state_memory_parent
; Private per-field writer routing; no additional resource or service grants.
custom_p4_project_version = 0.7.103-p4-r112-owners
build_flags =
  ${env:esp32_p4_state_memory_parent.build_flags}
  -DPET_VARIABLE_OWNERS_ENABLED=1

[env:esp32_p4_prefetch_parent]
extends = env:esp32_p4_variable_owners_parent
; Private existing-worker predecode experiment. No SDK/priority/guest grant change.
custom_p4_project_version = 0.7.103-p4-r113-prefetch
build_flags =
  ${env:esp32_p4_variable_owners_parent.build_flags}
  -DPET_P4_H264_PREFETCH=1
  -DPET_P4_ASSET_PREPARE_STACK_BYTES=6144U

[env:esp32_p4_startup_parent]
extends = env:esp32_p4_prefetch_parent
; Private bounded unsolicited handshake and spare-generation write comparison.
; Existing tasks, SDK, drivers, audio and all resource grants remain unchanged.
custom_p4_project_version = 0.7.103-p4-r114-startup
build_flags =
  ${env:esp32_p4_prefetch_parent.build_flags}
  -DPET_P4_HELLO_ASYNC=1
  -DPET_P4_SPARE_RECREATE=1
  -DPET_P4_APP_PHASE_TRACE=1

[env:esp32_p4_raster_parent]
extends = env:esp32_p4_prefetch_parent
; Exact-pixel alpha/font raster candidate; retain asynchronous startup without
; the unsuccessful spare-file recreation experiment. No new task or grant.
custom_p4_project_version = 0.7.103-p4-r115-raster
build_flags =
  ${env:esp32_p4_prefetch_parent.build_flags}
  -DPET_P4_HELLO_ASYNC=1
  -DPET_P4_APP_PHASE_TRACE=1
  -DPET_P4_RASTER_EXACT=1

[env:esp32_p4_delta_parent]
extends = env:esp32_p4_raster_parent
; Same pixels/transactions, with bounded alpha bursts and exact redundant-spare
; write avoidance. Unknown/new spare generations take the original writer.
custom_p4_project_version = 0.7.103-p4-r116-delta
build_flags =
  ${env:esp32_p4_raster_parent.build_flags}
  -DPET_P4_ALPHA_FAST=1
  -DPET_P4_SPARE_EXACT_REUSE=1

[env:esp32_p4_glyph_rows_parent]
extends = env:esp32_p4_delta_parent
; Exact source-sample reuse within one glyph/tile, no glyph/frame cache or IO.
custom_p4_project_version = 0.7.103-p4-r117-rows
build_flags =
  ${env:esp32_p4_delta_parent.build_flags}
  -DPET_P4_GLYPH_ROWS=1
  -DPET_FONT_METRICS_PACKED=1

[env:esp32_p4_span_target_parent]
extends = env:esp32_p4_glyph_rows_parent
; Private exact opaque-span retest and target-specific redundant-write filter.
; Numeric node timings do not exclude/reset any original frame or gap time.
custom_p4_project_version = 0.7.103-p4-r118-span2
build_flags =
  ${env:esp32_p4_glyph_rows_parent.build_flags}
  -DPET_P4_RENDER_SPAN_FILL=1
  -DPET_P4_SPARE_TARGET_FILTER=1
  -DPET_P4_APP_NODE_TRACE=1

[env:esp32_p4_dirty_parent]
extends = env:esp32_p4_span_target_parent
; Private exact dirty clean-frame reuse and unpublished spare-tail update.
; No public capability, task, driver or data format change; all old gates stay.
custom_p4_project_version = 0.7.103-p4-r119-dirty
build_flags =
  ${env:esp32_p4_span_target_parent.build_flags}
  -DPET_P4_APP_DIRTY_CACHE=1
  -DPET_P4_SPARE_UPDATE=1

[env:esp32_p4_phase_parent]
extends = env:esp32_p4_dirty_parent
; Private bounded raster retest and retained numeric timing evidence only.
; No new grants/tasks, no payload diagnostics and no changed acceptance gates.
custom_p4_project_version = 0.7.103-p4-r120-phase
build_flags =
  ${env:esp32_p4_dirty_parent.build_flags}
  -DPET_P4_RENDER_SPAN_PIXELS=128
  -DPET_P4_RETAIN_PEAK_PHASES=1
  -DPET_PROGRAM_PHASE_TRACE=1
  -DPET_P4_SPARE_OPEN_TRACE=1

[env:esp32_p4_bulk_parent]
extends = env:esp32_p4_phase_parent
; Private exact-pixel cache copies and unpublished JSON stream comparison.
; No new buffer/task/driver/grant, all original hardware gates remain.
custom_p4_project_version = 0.7.103-p4-r121-bulk
build_flags =
  ${env:esp32_p4_phase_parent.build_flags}
  -DPET_P4_APP_COPY_WORDS=1
  -DPET_P4_SPARE_UNBUFFERED=1
  -DPET_P4_QUERY_OBSERVATION=1

[env:esp32_p4_budget_parent]
extends = env:esp32_p4_phase_parent
; Private cooperative work admission and exact already-read page slices.
; R121 copy/unbuffered experiments are NOT inherited: no measured benefit.
custom_p4_project_version = 0.7.103-p4-r122-budget
build_flags =
  ${env:esp32_p4_phase_parent.build_flags}
  -DPET_P4_QUERY_OBSERVATION=1
  -DPET_P4_NATIVE_WORK_WINDOW=1
  -DPET_P4_APP_CACHE_POPULATION_BUDGET=1
  -DPET_P4_STORAGE_PAGE_CACHE_PARTIAL=1
  -DPET_P4_STORAGE_IO_RETAIN_COMPLETED=1

[env:esp32_p4_negotiated_parent]
extends = env:esp32_p4_budget_parent
; Private old/new transport negotiation and retained numeric frame evidence.
; No new execution grants, driver settings, timing limits, tasks or audio work.
custom_p4_project_version = 0.7.103-p4-r123-negotiated
build_flags =
  ${env:esp32_p4_budget_parent.build_flags}
  -DPET_P4_SERIAL_CONTROL_NEGOTIATED=1

[env:esp32_p4_progressive_parent]
extends = env:esp32_p4_negotiated_parent
; Private bounded warming of the existing clean frame; no extra framebuffer.
custom_p4_project_version = 0.7.103-p4-r124-progressive
build_flags =
  ${env:esp32_p4_negotiated_parent.build_flags}
  -DPET_P4_APP_CACHE_PROGRESSIVE=1
  -DPET_P4_RENDER_LCD_SPLIT_PROBE=1

[env:esp32_p4_logical_parent]
extends = env:esp32_p4_progressive_parent
; Private exact raster and read-only native-reference reuse; unchanged gates.
custom_p4_project_version = 0.7.103-p4-r125-logical
build_flags =
  ${env:esp32_p4_progressive_parent.build_flags}
  -DPET_P4_APP_PANEL_MIRROR=1
  -DPET_P4_LOGICAL_COMPARE=1
  -DPET_P4_SAVE_TRACE_DETACHED=1

[env:esp32_p4_retained_parent]
extends = env:esp32_p4_logical_parent
; Private final-frame ownership and exact sparse page copies; no new grants.
custom_p4_project_version = 0.7.103-p4-r126-retained
build_flags =
  ${env:esp32_p4_logical_parent.build_flags}
  -DPET_P4_APP_RETAIN_LOGICAL=1
  -DPET_P4_STORAGE_PAGE_CACHE_SPARSE=1

[env:esp32_p4_glyph_axis_parent]
extends = env:esp32_p4_retained_parent
; Private existing512-byte axis placement only; all raster expressions retained.
custom_p4_project_version = 0.7.103-p4-r129-axis
build_flags =
  ${env:esp32_p4_retained_parent.build_flags}
  -DPET_P4_GLYPH_AXIS_INTERNAL=1

[env:esp32_p4_frame_exact_parent]
extends = env:esp32_p4_glyph_axis_parent
; Private exact clear/glyph store paths and numeric frame/IO overlap evidence.
; Same pixels; no new buffer, task, grant, priority, clock or gate change.
custom_p4_project_version = 0.7.103-p4-r130-exact
build_flags =
  ${env:esp32_p4_glyph_axis_parent.build_flags}
  -DPET_P4_APP_CLEAR_OPAQUE_CENTER=1
  -DPET_P4_GLYPH_PIXEL_FAST=1
  -DPET_P4_FRAME_IO_OVERLAP=1

[env:esp32_p4_commit_lean_parent]
extends = env:esp32_p4_frame_exact_parent
; Private lean install-commit IO: in-place self-checked catalog generations and a
; boot-local sprite cleanup memo. No existence authority, buffer, task or grant.
custom_p4_project_version = 0.7.103-p4-r131-lean
build_flags =
  ${env:esp32_p4_frame_exact_parent.build_flags}
  -DPET_P4_COMMIT_LEAN_IO=1

[env:esp32_p4_storage_core_parent]
extends = env:esp32_p4_commit_lean_parent
; Private: protocol and save workers created on core 1 so unlocked storage IO
; never time-slices the renderer's core. Same priorities, lanes and gates.
custom_p4_project_version = 0.7.103-p4-r132-core
build_flags =
  ${env:esp32_p4_commit_lean_parent.build_flags}
  -DPET_P4_STORAGE_WORKERS_CORE1=1

[env:esp32_p4_gap_context_parent]
extends = env:esp32_p4_storage_core_parent
; Private numeric main-loop context for the inter-frame gap peak. No behavior change.
custom_p4_project_version = 0.7.103-p4-r133-gapctx
build_flags =
  ${env:esp32_p4_storage_core_parent.build_flags}
  -DPET_P4_GAP_PEAK_CONTEXT=1

[env:esp32_p4_ack_defer_parent]
extends = env:esp32_p4_gap_context_parent
; Private: the install ACK line is transmitted after the state lock is released
; (same dispatcher mechanism as deferred diagnostics). Wire order per request is unchanged.
custom_p4_project_version = 0.7.103-p4-r134-ackdefer
build_flags =
  ${env:esp32_p4_gap_context_parent.build_flags}
  -DPET_P4_MUTATION_ACK_DEFERRED=1

[env:esp32_p4_gap_holder_parent]
extends = env:esp32_p4_ack_defer_parent
; Private attribution for the gap-peak wait: state-mutex holder class, protocol worker
; topic hash, wall clock of the peak frame and the worker's longest locked span. No behavior change.
custom_p4_project_version = 0.7.103-p4-r135-holder
build_flags =
  ${env:esp32_p4_ack_defer_parent.build_flags}
  -DPET_P4_GAP_PEAK_HOLDER=1

[env:esp32_p4_large_reply_parent]
extends = env:esp32_p4_gap_holder_parent
; Private: widget/inventory and hello replies of a dispatched request are transmitted after the
; state lock is released (same held slot as the install ACK). Wire order per request is unchanged.
custom_p4_project_version = 0.7.103-p4-r136-largereply
build_flags =
  ${env:esp32_p4_gap_holder_parent.build_flags}
  -DPET_P4_LARGE_REPLY_DEFERRED=1

[env:esp32_p4_cold_fast_parent]
extends = env:esp32_p4_large_reply_parent
; Private: pixel-exact cold APP frame fast paths (1:1 image blit span, constant-alpha panel span,
; clear skipped under a full-screen opaque palette image or a full-screen JPEG first node with an exact
; failure fallback; constant-alpha panel via per-channel blend tables). cloud-hop cold frame 86.5 ms =
; clear 7.0 + jpeg 14.8 + panel 11.8 ms measured on r136; r139 showed the JPEG node and the clear
; untouched (coldFast imageNodes 0 / clearSkips 0, panel 11.8->4.4 ms). No behavior change.
custom_p4_project_version = 0.7.103-p4-r141-coldfast
build_flags =
  ${env:esp32_p4_large_reply_parent.build_flags}
  -DPET_P4_APP_COLD_FAST=1

[env:esp32_p4_ppa_copy_parent]
extends = env:esp32_p4_cold_fast_parent
; Private: the APP clean-frame copies (cache populate / prefix copy / cache-hit copy, 614 KB each,
; 8.4 ms as a CPU memcpy in PSRAM on r141) go through the PPA SRM client as a 1:1 blocking bit copy with
; a row-sampled self-check and permanent CPU fallback. Same bytes; DMA instead of CPU.
custom_p4_project_version = 0.7.103-p4-r143-ppacopy
build_flags =
  ${env:esp32_p4_cold_fast_parent.build_flags}
  -DPET_P4_APP_PPA_COPY=1

[env:esp32_p4_evboard_v3]
extends = env:esp32_p4_evboard
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
custom_p4_chip_family = v3
board_build.f_cpu = 400000000L

; Isolated service-bridge integration target. No release/default capability is
; opened by this declaration; this source must pass the existing fixed gates.
[env:esp32_p4_service_bridge_candidate]
extends = env:esp32_p4_program_public_candidate
custom_p4_project_version = 0.7.103-p4-servicebridge-c1
build_flags =
  ${env:esp32_p4_program_public_candidate.build_flags}
  -DPET_SERVICE_BRIDGE_ENABLED=1
  -DPET_HOST_COLLECTION_ENABLED=1
