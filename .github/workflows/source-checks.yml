name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: node pc/scripts/check-source-safety.mjs
      - run: node --test pc/scripts/check-source-safety.test.mjs
      - run: npm ci
        working-directory: pc
      - run: npm test
        working-directory: pc
      - run: npm run test:bridge
        working-directory: pc
      - run: npm run build:web
        working-directory: pc
  firmware-host:
    runs-on: ubuntu-latest
    env:
      CLANG: clang-20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select the reproducible WASM toolchain
        run: |
          test -x /usr/lib/llvm-20/bin/clang
          test -x /usr/lib/llvm-20/bin/wasm-ld
          /usr/lib/llvm-20/bin/clang --version
          /usr/lib/llvm-20/bin/wasm-ld --version
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
      - run: python -m pip install Pillow pytest platformio==6.1.19
      - name: Restore locked SDK downloads
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ${{ runner.temp }}/p4-v3-core
          key: p4-sdk-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies*.lock') }}
          restore-keys: p4-sdk-${{ runner.os }}-
      - name: Prepare locked v1 and v3 SDK test inputs
        run: python firmware/tools/prepare_ci_sdk.py --v3-core "$RUNNER_TEMP/p4-v3-core"
      - name: Save prepared SDK inputs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ${{ runner.temp }}/p4-v3-core
          key: p4-sdk-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies*.lock') }}
      - run: python -m pytest firmware/tests -q
      - run: python firmware/tests/protocol_contract_test.py
      - run: python firmware/tools/build_builtin_bundle.py --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Verify the scoped scanner exception
        run: python3 pc/scripts/check-gitleaks-policy.py --scanner "$RUNNER_TEMP/gitleaks"
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
