[package]
name = "pet-manager-tauri"
version = "0.1.199"
description = "pet-manager Tauri client"
authors = ["pet-manager contributors"]
license-file = "../../LICENSE"
edition = "2021"

[lib]
name = "pet_manager_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
devtools = ["tauri/devtools"]
# Development-only, user-triggered composer comparison. No USB, credentials,
# audio, model service or background runtime is initialized in this mode.
composer-diagnostic = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
libc = "0.2"
# `protocol-asset` is required by main for serving local widget assets.
tauri = { version = "2.11.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
regex = "1"
encoding_rs = "0.8"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "native-tls", "system-proxy", "gzip"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
futures-util = "0.3"
# Keep this compatible branch above the AsyncFd I/O-safety fix.
tokio = { version = "~1.51.6", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# Security floors for the TLS runtime shared by WebSocket/HTTP clients. No new
# default features: do not enable HTTP/3, a new crypto provider or cert compression.
rustls = { version = "0.23.46", default-features = false }
rustls-webpki = { version = "0.103.16", default-features = false }
webpki-roots = "1.0.10"
# image/webp decode for M13.1 codex-pet import (sprite sheet -> per-state MP4)
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
# USB serial communication with claw-pet board
serialport = "4"
rusb = { version = "0.9", features = ["vendored"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# MIoCo needs only fixed public-key RSAES-PKCS1-v1_5 encryption. Avoid the
# unpatched rsa private-operation implementation (CVE-2023-49092).
num-bigint-dig = { version = "0.8.6", default-features = false, features = ["std", "u64_digit", "zeroize"] }
pkcs1 = { version = "0.7.5", default-features = false }
spki = { version = "0.7.3", default-features = false }
zeroize = { version = "1.8.2", features = ["alloc"] }
rand = "0.8"
ring = "0.17.14"
zip = "0.6"
# Used by install_clawpkg_over_ssh to stage widget dirs before scp.
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Devices_Communication", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan"] }
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSPathUtilities", "NSString", "NSProcessInfo"] }

[dev-dependencies]
tempfile = "3.27.0"
